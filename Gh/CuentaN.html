<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Crear Cuenta Nueva</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-box">
    <h2>Crear Cuenta Nueva</h2>
    <form action="#" method="post" id="formularioRegistro">
      <label for="usuarioNuevo">Usuario</label>
      <input type="text" id="usuarioNuevo" name="usuarioNuevo" required />

      <label for="email">Correo Electrónico</label>
      <input type="email" id="email" name="email" required />

      <label for="contrasenaNueva">Contraseña</label>
      <input type="password" id="contrasenaNueva" name="contrasenaNueva" required />

      <label for="contrasenaConfirm">Confirmar Contraseña</label>
      <input type="password" id="contrasenaConfirm" name="contrasenaConfirm" required />

      <input type="submit" value="Registrarse" />
    </form>
    <div class="extra">
      <p><a href="index2.html">Volver al inicio de sesión</a></p>
    </div>
  </div>
  <script src="Cuenta.js"></script>
</body>
</html>
