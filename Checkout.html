<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout - Bloom</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:#f8f6f8;
    padding:40px;
}

.container{
    max-width:1000px;
    margin:auto;
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

h1,h2{
    color:#e84393;
    margin-bottom:20px;
}

input, select, textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    margin-top:8px;
    margin-bottom:15px;
}

label{
    font-weight:600;
}

.btn{
    width:100%;
    background:#e84393;
    color:white;
    border:none;
    padding:15px;
    border-radius:12px;
    cursor:pointer;
    font-size:16px;
}

.btn:hover{
    background:#d63384;
}

.total{
    font-size:28px;
    font-weight:bold;
    color:#e84393;
}

.exito{
    display:none;
    text-align:center;
    padding:30px;
}

.exito h2{
    color:#27ae60;
}

@media(max-width:768px){
    .container{
        grid-template-columns:1fr;
    }
}
.btn-flotante-volver{
    position:fixed;
    top:20px;
    left:20px;
    width:50px;
    height:50px;
    background:#ff5c8d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:20px;
    text-decoration:none;
    box-shadow:0 5px 15px rgba(0,0,0,.2);
    transition:.3s;
    z-index:999;
}

.btn-flotante-volver:hover{
    transform:scale(1.1);
    background:#e84370;
}

</style>
</head>
<body>

<div id="formularioCheckout">

    <h1>🌸 Finalizar Compra</h1>
    <a href="index.html" class="btn-flotante-volver">🏠</a>

    <div class="container">

        <div class="card">

            <h2>Información de entrega</h2>

            <label>Nombre completo</label>
            <input type="text" required>

            <label>Teléfono</label>
            <input type="tel" required>

            <label>Correo electrónico</label>
            <input type="email" required>

            <label>Dirección</label>
            <textarea rows="4"></textarea>

            <h2>Método de pago</h2>

            <select>
                <option>Tarjeta de crédito</option>
                <option>Tarjeta de débito</option>
                <option>Transferencia bancaria</option>
                <option>Pago contra entrega</option>
            </select>

            <label>Número de tarjeta</label>
            <input type="text" placeholder="1234 5678 9012 3456">

            <label>Nombre del titular</label>
            <input type="text">

            <label>Fecha de vencimiento</label>
            <input type="text" placeholder="MM/AA">

            <label>CVV</label>
            <input type="text" placeholder="123">

            <button class="btn" onclick="comprar()">
                💳 Confirmar pedido
            </button>

        </div>

        <div class="card">

            <h2>Resumen</h2>

            <p>Productos: <span id="cantidadProductos">0</span></p>

            <br>

            <div class="total">
                $<span id="total">0</span> MXN
            </div>

        </div>

    </div>

</div>

<div id="mensajeExito" class="exito">

    <h2>✅ Pedido registrado</h2>

    <p>Gracias por comprar en Bloom.</p>

    <br>

    <p>
        Este checkout es una demostración y no realiza
        cobros reales.
    </p>

    <br>

    <a href="index.html">
        Volver al inicio
    </a>

</div>

<script>

const carrito =
JSON.parse(localStorage.getItem("carrito")) || [];

let total = 0;
let cantidad = 0;

carrito.forEach(producto=>{

    total += producto.precio * producto.cantidad;
    cantidad += producto.cantidad;

});

document.getElementById("total").textContent = total;
document.getElementById("cantidadProductos").textContent = cantidad;

function comprar(){

    document.getElementById("formularioCheckout").style.display = "none";

    document.getElementById("mensajeExito").style.display = "block";

    localStorage.removeItem("carrito");
}

</script>

</body>
</html>
