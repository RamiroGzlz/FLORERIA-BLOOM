<style>
/* Botón volver */
.btn-flotante-volver{
    position:fixed;
    top:20px;
    left:20px;
    width:50px;
    height:50px;
    background:#ff5c8d;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    font-size:20px;
    text-decoration:none;
    box-shadow:0 5px 15px rgba(19, 54, 255, 0.2);
    transition:.3s;
    z-index:999;
}
.btn-flotante-volver:hover{
    transform:scale(1.1);
}

/* Botón carrito flotante */
.btn-carrito-flotante{
    position: fixed;
    top: 20px;
    right: 20px;
    width: 55px;
    height: 55px;
    background: #ff5c8d;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 22px;
    text-decoration: none;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
    z-index: 9999;
    transition: 0.3s ease;
}
.btn-carrito-flotante:hover{
    transform: scale(1.15);
    background: #ff2f7a;
}

/* Estilos generales */
body{
    background:#f5f5f5;
    font-family: 'Poppins', sans-serif;
}

.titulo{
    text-align:center;
    font-size:3rem;
    margin:40px 0;
}

/* Grid catálogo */
.catalogo-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:40px;
}

/* Tarjeta producto unificada */
.producto{
    background: white;
    border: 3px solid #ff7eb3;
    border-radius: 20px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,.1);
    transition: all .3s ease;
}

.producto:hover{
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(255,126,179,.3);
    border-color: #ff4f9a;
}

/* Imagen */
.producto img{
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 15px;
}

/* Título y precio */
.producto h3{
    margin: 15px 0 10px;
    color: #444;
}
.producto .precio{
    font-size: 1.2rem;
    font-weight: bold;
    color: #ff4f9a;
    margin-bottom: 15px;
}

/* Botón agregar al carrito */
.btn-carrito{
    background: linear-gradient(135deg,#ff7eb3,#ff4f9a);
    color: white;
    border: none;
    padding: 12px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    transition: .3s;
}
.btn-carrito:hover{
    background: linear-gradient(135deg,#ff4f9a,#e84393);
    transform: scale(1.05);
}
</style>
</head>

<script>
function agregarCarrito(nombre, precio, imagen){
    let carrito = JSON.parse(localStorage.getItem("carrito")) || [];
    let existente = carrito.find(item => item.nombre === nombre);

    if(existente){
        existente.cantidad++;
    }else{
        carrito.push({
            nombre,
            precio,
            imagen,
            cantidad: 1
        });
    }

    localStorage.setItem("carrito", JSON.stringify(carrito));
    alert(nombre + " agregado al carrito");
}
const params = new URLSearchParams(window.location.search);
const busqueda = params.get("busqueda");

if (busqueda) {
